# Orçamento 2026 — proxy HTTPS (443, com redirect 80 -> 443) na frente do Streamlit (127.0.0.1:8501).
# Instalado em /etc/nginx/sites-available/orcamento-2026 (link em sites-enabled).
# Bloco TLS gerado pelo Certbot (certbot --nginx -d orc.167.88.33.108.sslip.io --redirect).
server {
    server_name orc.167.88.33.108.sslip.io;

    # Uploads da tela Início (bases.xlsx, orcamento2026.db); limite padrão do Streamlit é 200 MB.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # O Streamlit depende de websocket (/_stcore/stream).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # Sessão websocket fica aberta enquanto a aba estiver aberta.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/orc.167.88.33.108.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/orc.167.88.33.108.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = orc.167.88.33.108.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name orc.167.88.33.108.sslip.io;
    return 404; # managed by Certbot


}